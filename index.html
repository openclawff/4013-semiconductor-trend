<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8f9fa;color:#333}
.header{background:#fff;border-bottom:1px solid #e1e4e8;padding:10px 20px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:15px;font-weight:600;color:#24292e}
.header .sub{font-size:11px;color:#586069;margin-left:8px}
.header-right{display:flex;gap:8px;align-items:center}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e1e4e8;padding:0 16px}
.tab{padding:9px 16px;font-size:12px;font-weight:500;color:#586069;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab:hover{color:#24292e}
.tab.active{color:#0366d6;border-bottom-color:#0366d6;font-weight:600}
.tab .badge{display:inline-block;background:#ffc107;color:#856404;font-size:9px;padding:1px 4px;border-radius:6px;margin-left:3px;font-weight:600}
.market-bar{display:flex;gap:10px;padding:6px 20px;background:#fff;border-bottom:1px solid #e1e4e8;flex-wrap:wrap;align-items:center}
.market-bar .mkt{display:flex;align-items:center;gap:4px;font-size:11px;color:#586069}
.market-bar .mkt .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.market-bar .mkt .dot.open{background:#28a745;box-shadow:0 0 4px #28a74566}

.legend{display:flex;gap:12px;padding:6px 20px;background:#fff;border-bottom:1px solid #e1e4e8;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#586069}
.legend-item .dot{width:7px;height:7px;border-radius:50%;display:inline-block}

.chart-wrap{position:relative;background:#fff;margin:6px 10px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:visible;height:calc(100vh - 260px);min-height:300px}
.main-layout{display:flex;gap:0;margin:6px 10px;height:calc(100vh - 260px);min-height:300px}
.chart-area{flex:1;background:#fff;border-radius:8px 0 0 8px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:visible;position:relative}
.right-dock{width:320px;min-width:320px;background:#fff;border-left:1px solid #e1e4e8;border-radius:0 8px 8px 0;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow-y:auto;display:none}
.right-dock.open{display:block}

#chart1,#chart2,#chart3{width:100%;height:100%}
.panel{display:none;width:100%;height:100%}
.panel.active{display:block}
.popup{display:none;position:fixed;background:#fff;border:1px solid #d1d5da;border-radius:8px;padding:10px 14px;box-shadow:0 4px 12px rgba(0,0,0,.12);font-size:11px;z-index:100;max-width:320px;pointer-events:none}
.popup .t{font-weight:600;font-size:12px;margin-bottom:4px;color:#24292e}
.popup .r{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.popup .r .l{color:#586069}
.popup .r .v{font-weight:500}
.popup .r .v.up{color:#28a745}.popup .r .v.down{color:#dc3545}.popup .r .v.rg{color:#8b949e}
.ap{position:relative;background:rgba(255,255,255,.96);border:1px solid #e1e4e8;border-radius:8px;padding:10px 14px;font-size:11px;z-index:10;overflow-y:auto;max-height:60%}
.ap .ap-t{font-weight:600;font-size:12px;margin-bottom:6px;color:#24292e;border-bottom:1px solid #e1e4e8;padding-bottom:4px;cursor:pointer;user-select:none}
.ap .ap-t::before{content:'▶ ';font-size:10px}
.ap.open .ap-t::before{content:'▼ '}
.ap .ap-body{display:none}
.ap.open .ap-body{display:block}
.ap .ap-s{margin-bottom:8px}
.ap .ap-st{font-weight:600;font-size:11px;color:#586069;margin-bottom:3px}
.ap .ap-r{display:flex;justify-content:space-between;padding:2px 0;font-size:10px}
.ap .ap-l{color:#586069}
.ap .ap-v{font-weight:600}
.ap .ap-v.up{color:#28a745}
.ap .ap-v.down{color:#dc3545}
.ap .ap-v.warn{color:#e67e22}
.ap .ap-v.ok{color:#28a745}
.ap .ap-v.neutral{color:#8b949e}
.ap .ap-tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:600}
.ap .ap-tag.surge{background:#ffc10722;color:#856404}
.ap .ap-tag.burst{background:#dc354522;color:#856404}
.ap .ap-tag.normal{background:#d4edda22;color:#155724}
.ap .ap-tag.div{background:#ffc10722;color:#856404}
.ap .ap-tag.sync{background:#d4edda22;color:#155724}
.ap .ap-tag.inv{background:#f8d7da22;color:#721c24}
.ap .ap-tag.relay{background:#cce5ff22;color:#004085}
.ap .ap-tag.turn{background:#dc354522;color:#721c24}
.ap .ap-tag.safe{background:#d4edda22;color:#155724}
/* 单市场卡片 */
.mkt-card{background:#fff;margin:4px 10px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.mkt-card-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;cursor:pointer;user-select:none;border-bottom:1px solid #f0f0f0;transition:background .15s}
.mkt-card-hdr:hover{background:#f6f8fa}
.mkt-card-hdr .mkt-name{font-size:13px;font-weight:600;color:#24292e}
.mkt-card-hdr .mkt-status{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600}
.mkt-card-hdr .mkt-status.open{background:#d4edda;color:#155724}
.mkt-card-hdr .mkt-status.closed{background:#f8d7da;color:#721c24}
.mkt-card-hdr .mkt-status.pre{background:#fff3cd;color:#856404}
.mkt-card-hdr .mkt-status.h24{background:#cce5ff;color:#004085}
.mkt-card-hdr .arrow{font-size:11px;color:#8b949e;transition:transform .2s}

.mkt-card-body{display:none;padding:0}
.mkt-card-body.open{display:block}
.mkt-card-chart{width:100%;height:180px}
.mkt-card-info{padding:6px 14px;font-size:10px;color:#586069;border-top:1px solid #f0f0f0;display:flex;gap:12px;flex-wrap:wrap}
.mkt-card-info span{white-space:nowrap}
.intraday-panel{width:100%;border:none;border-radius:0;padding:10px 14px}
.offhours-panel{width:100%;border:none;border-radius:0;padding:10px 14px}

/* 相关性背离 collapsible */
.corr-section{background:#fff;margin:6px 10px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.corr-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none;border-bottom:1px solid #e1e4e8;transition:background .15s}
.corr-header:hover{background:#f6f8fa}
.corr-header .corr-title{font-size:13px;font-weight:600;color:#24292e}
.corr-header .corr-type{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;margin-left:8px}
.corr-header .corr-type.pos{background:#d4edda;color:#155724}
.corr-header .corr-type.neg{background:#f8d7da;color:#721c24}
.corr-header .corr-status{font-size:11px;font-weight:500}
.corr-header .corr-status.ok{color:#28a745}
.corr-header .corr-status.div{color:#dc3545;font-weight:700}
.corr-header .arrow{font-size:12px;color:#8b949e;transition:transform .2s}
.corr-header.open .arrow{transform:rotate(90deg)}
.corr-body{display:none;padding:0}
.corr-body.open{display:block}
.corr-chart{width:100%;height:200px}
.corr-info{padding:8px 14px;font-size:11px;color:#586069;border-top:1px solid #f0f0f0}
.corr-info .ci-r{display:flex;justify-content:space-between;padding:2px 0}
.corr-info .ci-l{color:#8b499e}
.corr-info .ci-v{font-weight:600}
</style>

<body>
<div class="header">
  <div style="display:flex;align-items:baseline">
    <h1>🌐 4013 全球半导体 · 趋势监控</h1>

<script>
const D='data';let charts={};let series={};let allD={};let currentTab=0;let corrCharts={};let bondCharts={};
const API4002='http://192.168.25.144:4002';
const HKT_OFFSET=28800;
const REFRESH_INTERVAL=60000;

const MKT={
  segments_SSE980017:{c:'#28a745',n:'A股半导体',market:'CN',symbol:'SZSE:980017'},
  segments_HK_HSCASEMI:{c:'#e83e8c',n:'港股半导体',market:'HK',symbol:'HSI:HSCASEMI'},
  segments_NIKKEI:{c:'#0366d6',n:'日本日经',market:'JP',symbol:'NIKKEI'},
  segments_KOSPI:{c:'#db6d28',n:'韩国KOSPI',market:'KR',symbol:'KOSPI'}
};

const SESSIONS={
  CN:{name:'A股',sessions:[[9,30,11,30],[13,0,15,0]],tz:8},
  HK:{name:'港股',sessions:[[9,30,12,0],[13,0,16,0]],tz:8},
  JP:{name:'日经',sessions:[[8,0,10,30],[11,30,14,0]],tz:9},
  KR:{name:'KOSPI',sessions:[[8,0,14,30]],tz:9},
  US:{name:'美股',sessions:[[21,30,24,0],[0,0,4,0]],tz:-4},
  EU:{name:'欧股',sessions:[[15,0,19,30]],tz:2},
};

function getLocalTime(tz){const now=new Date();const utc=now.getTime()+now.getTimezoneOffset()*60000;return new Date(utc+tz*3600000);}
function getHKT(){return getLocalTime(8);}
// UTC→HKT 转换所有时间戳
function toHKT(ts){return ts+HKT_OFFSET;}
function fromHKT(hkt){return hkt-HKT_OFFSET;}

function isMarketOpen(mk){
  const rule=SESSIONS[mk];if(!rule)return{open:false,status:'unknown'};
  const local=getLocalTime(rule.tz);const h=local.getHours(),m=local.getMinutes();const hm=h*60+m;
  for(const[sH,sM,eH,eM]of rule.sessions){
    const start=sH*60+sM;let end=eH*60+eM;if(end<=start)end+=24*60;
    let check=hm;if(hm<start&&end>24*60)check=hm+24*60;
    if(check>=start&&check<end)return{open:true,status:'open',localTime:local};
  }
  for(const[sH,sM]of rule.sessions){const start=sH*60+sM;if(hm>=start-30&&hm<start)return{open:false,status:'pre',localTime:local};}
  return{open:false,status:'closed',localTime:local};
}
function formatLocalTime(tz){const t=getLocalTime(tz);return t.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});}
function updateMarketBar(){
  const el=document.getElementById('marketBar');const now=getHKT();let h='';
  const markets=[{key:'CN'},{key:'HK'},{key:'JP'},{key:'KR'},{key:'US'},{key:'EU'}];
  for(const m of markets){
    const rule=SESSIONS[m.key];const st=isMarketOpen(m.key);
    const dotCls=st.open?'open':st.status==='pre'?'pre':'closed';
    const statusTxt=st.open?'开盘':st.status==='pre'?'盘前':'休市';
    const localTime=formatLocalTime(rule.tz);
    h+=`<div class="mkt"><span class="dot ${dotCls}"></span><span>${rule.name}</span><span style="color:${st.open?'#28a745':'#8b949e'};font-size:10px">${statusTxt} ${localTime}</span></div>`;
    if(m.key!=='EU')h+=`<span class="sep">|</span>`;
  }
  h+=`<span class="sep">|</span><div class="mkt"><span class="dot open"></span><span>SOXL/3</span><span style="color:#28a745;font-size:10px">24h</span></div>`;
  h+=`<span class="clock">HKT ${now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}</span>`;
  el.innerHTML=h;
}

// ========== Real-time K-line from 4002 (返回UTC时间戳) ==========
async function fetchRTKlines(symbol, resolution, days){
  const now=Math.floor(Date.now()/1000);
  const frm=now-days*86400;
  try{
    const url=API4002+'/history?symbol='+encodeURIComponent(symbol)+'&resolution='+resolution+'&from='+frm+'&to='+now;
    const r=await fetch(url);if(!r.ok)return null;
    const d=await r.json();if(d.s!=='ok'||!d.t||!d.t.length)return null;
    // 返回的t是UTC秒，不转换（在显示时转换）
    return d.t.map((t,i)=>({time:t,open:d.o[i],high:d.h[i],low:d.l[i],close:d.c[i],volume:d.v[i]}));
  }catch(e){console.error('fetchRT',symbol,e);return null;}
}

// ========== 4002 分析API代理 ==========
async function fetch4002(path){
  try{const r=await fetch(API4002+path);if(!r.ok)return null;return await r.json();}catch(e){return null;}
}

// ========== Data Loading ==========
function fetchWithTimeout(url, timeoutMs=5000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(), timeoutMs);
  return fetch(url, {signal:controller.signal}).finally(()=>clearTimeout(timer));
}
async function loadAll(){
  const files=['segments_SSE980017.json','segments_HK_HSCASEMI.json','segments_NIKKEI.json','segments_KOSPI.json','summary.json'];
  for(const f of files){try{const r=await fetch(D+'/'+f);if(r.ok)allD[f.replace('.json','')]=await r.json();}catch(e){}}
  // SOXL: fetch from 5050 via server proxy (real-time, not static file)
  try{const r=await fetchWithTimeout('/api/soxl',20000);if(r.ok){const d=await r.json();if(Array.isArray(d)&&d.length){allD.soxl_baseline=d;console.log('SOXL 5050 OK:',d.length,'bars, last:',new Date(d[d.length-1].time*1000).toISOString());}}}catch(e){console.warn('SOXL 5050 failed:',e.message);}
  for(const f of['CFDGOLD','USDX_FX','BTC_SPOT','CL']){try{const r=await fetch(D+'/futures_'+f+'.json');if(r.ok)allD['f_'+f]=await r.json();}catch(e){}}
  try{const r=await fetchWithTimeout('/api/bond-hedge',15000);if(r.ok)allD.bond_hedge=await r.json();}catch(e){console.log('bond-hedge fetch failed:',e.message);}
  // 实时K线（并行，每个带超时）
  const rtPromises=Object.entries(MKT).map(async([k,cfg])=>{
    try{
      const r=await fetchWithTimeout(API4002+'/history?symbol='+encodeURIComponent(cfg.symbol)+'&resolution=1&from='+(Math.floor(Date.now()/1000)-86400)+'&to='+Math.floor(Date.now()/1000), 8000);
      if(r.ok){const d=await r.json();if(d.s==='ok'&&d.t&&d.t.length){allD['rt_'+k]=d.t.map((t,i)=>({time:t,open:d.o[i],high:d.h[i],low:d.l[i],close:d.c[i],volume:d.v[i]}));console.log('RT OK:',cfg.n,allD['rt_'+k].length);}}
    }catch(e){console.warn('RT FAIL:',cfg.n,e.message);}
  });
  await Promise.allSettled(rtPromises);
  // 4002 分析数据（并行，带超时，不阻塞UI）
  const analysisPromises=[
    fetchWithTimeout(API4002+'/api/monitor/sectors?market=CN',5000).then(r=>r.ok?r.json():null).then(d=>{if(d)allD.sectors_cn=d;}).catch(()=>{}),
    fetchWithTimeout(API4002+'/api/monitor/sectors?market=HK',5000).then(r=>r.ok?r.json():null).then(d=>{if(d)allD.sectors_hk=d;}).catch(()=>{}),
    fetchWithTimeout(API4002+'/api/tracking/reversal',5000).then(r=>r.ok?r.json():null).then(d=>{if(d)allD.reversals=d;}).catch(()=>{}),
    fetchWithTimeout(API4002+'/api/monitor/volume-surges',5000).then(r=>r.ok?r.json():null).then(d=>{if(d)allD.volume_surges=d;}).catch(()=>{}),
    fetchWithTimeout(API4002+'/signal/sector-realtime',5000).then(r=>r.ok?r.json():null).then(d=>{if(d)allD.sector_realtime=d;}).catch(()=>{}),
    fetchWithTimeout(API4002+'/api/correlation/all',5000).then(r=>r.ok?r.json():null).then(d=>{if(d)allD.correlation=d;}).catch(()=>{}),
  ];
  // 3402 放量数据（核心信号，通过server代理）
  const surgePromises=[
    fetchWithTimeout('/api/surge',10000).then(r=>r.ok?r.json():null).then(d=>{if(d){allD.surge_global=d.global||null;allD.surge_commodity=d.commodity||null;}}).catch(()=>{}),
  ];
  await Promise.allSettled([...analysisPromises,...surgePromises]);
}

// ========== Chart Helpers ==========
// 兼容两种数据格式: UDF {t[],c[]} 和 数组 [{time,close}]
function toKlines(d){
  if(!d)return[];
  // 数组格式 [{time,open,high,low,close,volume}] 或 [{time,close}]
  if(Array.isArray(d))return d.map(k=>({time:toHKT(k.time),open:k.open||k.close,high:k.high||k.close,low:k.low||k.close,close:k.close,volume:k.volume||0}));
  // UDF格式 {t[],o[],h[],l[],c[],v[]}
  if(d.t&&d.c)return d.t.map((t,i)=>({time:toHKT(t),open:d.o?d.o[i]:d.c[i],high:d.h?d.h[i]:d.c[i],low:d.l?d.l[i]:d.c[i],close:d.c[i],volume:d.v?d.v[i]:0}));
  return [];
}
// 统一归一化: 所有线基于soxlRef（SOXL第一个close）
// 保证所有线在相同基准上可比
let _soxlRef=null;
function getSoxlRef(){
  if(_soxlRef!==null)return _soxlRef;
  const soxl=allD.soxl_baseline;
  if(!soxl)return 1;
  if(Array.isArray(soxl)&&soxl.length)_soxlRef=soxl[0].close;
  else if(soxl.c&&soxl.c.length)_soxlRef=soxl.c[0];
  return _soxlRef||1;
}
function normPct(klines){
  if(!klines)return[];
  const ref=getSoxlRef();
  let arr=[];
  if(Array.isArray(klines))arr=klines.map(k=>({time:toHKT(k.time),close:k.close}));
  else if(klines.t&&klines.c)arr=klines.t.map((t,i)=>({time:toHKT(t),close:klines.c[i]}));
  if(!arr.length)return[];
  return arr.map(k=>({time:k.time,value:((k.close-ref)/ref)*100}));
}
// 期货数据归一化: 同样基于soxlRef
// 各市场独立归一化（用自己的第一个close）
function normPctIndependent(klines){
  if(!klines)return[];
  let arr=[];
  if(Array.isArray(klines))arr=klines.map(k=>({time:toHKT(k.time),close:k.close}));
  else if(klines.t&&klines.c)arr=klines.t.map((t,i)=>({time:toHKT(t),close:klines.c[i]}));
  if(!arr.length)return[];
  const ref=arr[0].close;
  if(!ref)return[];
  return arr.map(k=>({time:k.time,value:((k.close-ref)/ref)*100}));
}
// 期货数据归一化: 基于soxlRef
function normPctHKT(data){
  if(!data||!data.length)return[];
  const ref=getSoxlRef();
  return data.map(d=>({time:toHKT(d.time),value:((d.close-ref)/ref)*100}));
}

// ========== DXY Divergence ==========
function computeDXYDivergence(){
  const dxy=normPctHKT(allD.f_USDX_FX);if(!dxy.length)return[];
  const pairs=[
    {name:'DXY×黄金',data:normPctHKT(allD.f_CFDGOLD),expected:'inverse'},
    {name:'DXY×BTC',data:normPctHKT(allD.f_BTC_SPOT),expected:'positive'},
    {name:'DXY×原油',data:normPctHKT(allD.f_CL),expected:'inverse'},
  ];
  const results=[];
  for(const pair of pairs){
    if(!pair.data.length)continue;
    const dxyMap=new Map(dxy.map(d=>[d.time,d.value]));
    const pairMap=new Map(pair.data.map(d=>[d.time,d.value]));
    const common=[...dxyMap.keys()].filter(t=>pairMap.has(t)).sort((a,b)=>a-b);
    if(common.length<2)continue;
    const w=Math.min(20,common.length);const recent=common.slice(-w);
    const dxyV=recent.map(t=>dxyMap.get(t));const pairV=recent.map(t=>pairMap.get(t));
    const n=recent.length;const mx=dxyV.reduce((a,b)=>a+b,0)/n;const my=pairV.reduce((a,b)=>a+b,0)/n;
    let num=0,dx=0,dy=0;for(let i=0;i<n;i++){num+=(dxyV[i]-mx)*(pairV[i]-my);dx+=(dxyV[i]-mx)**2;dy+=(pairV[i]-my)**2;}
    const corr=dx&&dy?num/Math.sqrt(dx*dy):0;
    const dxyDir=dxyV[n-1]-dxyV[0]||0;const pairDir=pairV[n-1]-pairV[0]||0;
    const isDiv=(dxyDir>0&&pairDir>0)||(dxyDir<0&&pairDir<0);
    results.push({name:pair.name,corr:corr.toFixed(3),dxyDir:dxyDir>0?'↑':dxyDir<0?'↓':'→',pairDir:pairDir>0?'↑':pairDir<0?'↓':'→',isDiv});
  }
  return results;
}

// ========== 转折检测（3条件） ==========
function detectReversals(){
  const results=[];
  for(const[k,data]of Object.entries(allD)){
    if(!k.startsWith('segments_')||!data.segments)continue;
    const cfg=MKT[k];if(!cfg)continue;
    for(const seg of data.segments){
      const segStart=seg.startTime||seg.start_time;
      const segEnd=seg.endTime||seg.end_time;
      if(!segStart||!segEnd)continue;
      // 条件1: 涨跌幅度 > 1%
      const pct=seg.pctChange||seg.pct||0;
      const condition1=Math.abs(pct)>=1.0;
      // 条件2: 与SOXL方向相反(背离)
      const condition2=!!seg.divergence;
      // 条件3: 成交量放大
      const condition3=seg.volumeSurge||seg.surge||false;
      const score=(condition1?1:0)+(condition2?1:0)+(condition3?1:0);
      if(score>=2){
        const t1=new Date(toHKT(segStart)*1000).toLocaleString('zh-CN',{timeZone:'Asia/Hong_Kong',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
        const t2=new Date(toHKT(segEnd)*1000).toLocaleString('zh-CN',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit'});
        results.push({market:cfg.n,color:cfg.c,segId:seg.id,time:`${t1}-${t2}`,pct,condition1,condition2,condition3,score});
      }
    }
  }
  results.sort((a,b)=>b.score-a.score||Math.abs(b.pct)-Math.abs(a.pct));
  return results;
}

// 生成唯一canvas ID（每个chart独立）
let _canvasUid=0;
function getOrCreateOverlay(container,uid,suffix){
  const id='ov_'+uid+'_'+suffix;
  let ov=document.getElementById(id);
  if(!ov){ov=document.createElement('canvas');ov.id=id;ov.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5';container.style.position='relative';container.appendChild(ov);}
  return ov;
}
function drawDivergenceOverlay(ch,seriesMap,allData,uid){
  const container=ch.chartElement();
  const ov=getOrCreateOverlay(container,uid,'div');
  const ctx=ov.getContext('2d');const W=container.clientWidth,H=container.clientHeight;ov.width=W;ov.height=H;ctx.clearRect(0,0,W,H);

  const soxl=allData.soxl_baseline;if(!soxl)return;
  // 兼容数组格式 [{time,close}] 和UDF格式 {t[],c[]}
  let soxlRef,soxlPctMap=new Map();
  if(Array.isArray(soxl)&&soxl.length){
    soxlRef=soxl[0].close;
    for(const d of soxl)soxlPctMap.set(toHKT(d.time),((d.close-soxlRef)/soxlRef)*100);
  }else if(soxl.t&&soxl.c&&soxl.c.length){
    soxlRef=soxl.c[0];
    for(let i=0;i<soxl.t.length;i++)soxlPctMap.set(toHKT(soxl.t[i]),((soxl.c[i]-soxlRef)/soxlRef)*100);
  }else return;

  let ci=0;
  for(const[k,data]of Object.entries(allData)){
    if(!k.startsWith('segments_')||!data.segments)continue;
    const mktSeries=seriesMap[k];if(!mktSeries)continue;
    const soxlSeries=seriesMap.soxl;if(!soxlSeries)continue;

    let mktBars=[];
    const rtKey='rtPct_'+k;
    if(allData[rtKey]&&allData[rtKey].length)mktBars=allData[rtKey];
    else if(data.t&&data.c&&data.t.length){const ref=data.c[0];mktBars=data.t.map((t,i)=>({time:toHKT(t),pct:((data.c[i]-ref)/ref)*100}));}
    else if(Array.isArray(data)&&data.length){const ref=data[0].close;mktBars=data.map(d=>({time:toHKT(d.time),pct:((d.close-ref)/ref)*100}));}
    if(!mktBars.length)continue;
    const mktPctMap=new Map(mktBars.map(b=>[b.time,b.pct]));

    const segColors=['rgba(255,193,7,0.25)','rgba(255,107,107,0.25)','rgba(70,130,220,0.25)','rgba(232,62,140,0.25)'];
    const strokeColors=['rgba(255,150,0,0.5)','rgba(255,80,80,0.5)','rgba(50,110,200,0.5)','rgba(200,50,120,0.5)'];

    for(const seg of data.segments){
      const segStart=toHKT(seg.startTime||seg.start_time);
      const segEnd=toHKT(seg.endTime||seg.end_time);
      if(!segStart||!segEnd)continue;
      const segMktBars=mktBars.filter(b=>b.time>=segStart&&b.time<=segEnd);
      if(segMktBars.length<2)continue;

      const mktStart=segMktBars[0].pct;const mktEnd=segMktBars[segMktBars.length-1].pct;
      const mktDir=mktEnd-mktStart;
      let soxlStartPct=null,soxlEndPct=null;
      for(const[st,sp]of soxlPctMap){if(st>=segStart&&soxlStartPct===null)soxlStartPct=sp;if(st<=segEnd)soxlEndPct=sp;}
      if(soxlStartPct===null||soxlEndPct===null)continue;
      const soxlDir=soxlEndPct-soxlStartPct;
      const isDiv=Math.abs(mktDir)>0.05&&Math.abs(soxlDir)>0.05&&((mktDir>0&&soxlDir<0)||(mktDir<0&&soxlDir>0));
      const ci2=ci%segColors.length;

      ctx.fillStyle=isDiv?segColors[ci2]:'rgba(100,150,200,0.06)';
      ctx.strokeStyle=isDiv?strokeColors[ci2]:'rgba(100,150,200,0.15)';
      ctx.lineWidth=0.5;ctx.beginPath();let started=false;
      for(const b of segMktBars){const x=ch.timeScale().timeToCoordinate(b.time);const y=mktSeries.priceToCoordinate(b.pct);if(x===null||y===null)continue;if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);}
      for(let i=segMktBars.length-1;i>=0;i--){const b=segMktBars[i];const sp=soxlPctMap.get(b.time);if(sp===undefined)continue;const x=ch.timeScale().timeToCoordinate(b.time);const y=soxlSeries.priceToCoordinate(sp);if(x===null||y===null)continue;ctx.lineTo(x,y);}
      ctx.closePath();ctx.fill();ctx.stroke();

      // 段ID标注
      if(seg.id&&segMktBars.length>0){
        const midBar=segMktBars[Math.floor(segMktBars.length/2)];
        const x=ch.timeScale().timeToCoordinate(midBar.time);
        const yTop=mktSeries.priceToCoordinate(Math.max(mktStart,mktEnd));
        if(x!==null&&yTop!==null&&yTop>15&&yTop<H-15){
          const label=seg.id+(isDiv?' ⚠️':'');
          ctx.font='bold 8px monospace';const tw=ctx.measureText(label).width;
          ctx.fillStyle=isDiv?'rgba(255,150,0,0.15)':'rgba(100,150,200,0.08)';
          ctx.strokeStyle=isDiv?'rgba(255,150,0,0.6)':'rgba(100,150,200,0.3)';
          ctx.lineWidth=0.5;ctx.beginPath();ctx.roundRect(x-tw/2-3,yTop-13,tw+6,13,2);ctx.fill();ctx.stroke();
          ctx.fillStyle=isDiv?'#e67e22':'#666';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x,yTop-6);
        }
      }
    }
    ci++;
  }
}

// ========== Segment Labels ==========
function drawSegmentLabels(ch,seriesMap,allData,uid){

  for(const[k,data]of Object.entries(allData)){
    if(!k.startsWith('segments_')||!data.segments)continue;const s=seriesMap[k];if(!s)continue;const col=colors[k]||'#666';
    for(const seg of data.segments){
      const midTime=toHKT(Math.floor(((seg.startTime||seg.start_time)+(seg.endTime||seg.end_time))/2));
      const x=ch.timeScale().timeToCoordinate(midTime);if(x===null||x<0||x>W)continue;
      const segBars=[];
      if(data.t&&data.c){for(let i=0;i<data.t.length;i++){if(data.t[i]>=(seg.startTime||seg.start_time)&&data.t[i]<=(seg.endTime||seg.end_time))segBars.push(data.c[i]);}}
      else if(Array.isArray(data)){for(const d of data){if(d.time>=(seg.startTime||seg.start_time)&&d.time<=(seg.endTime||seg.end_time))segBars.push(d.close);}}
      if(!segBars.length)continue;
      const midPrice=segBars[Math.floor(segBars.length/2)];const refPrice=data.o?data.o[0]:segBars[0];
      const midPct=((midPrice-refPrice)/refPrice)*100;const y=s.priceToCoordinate(midPct);
      if(y===null||y<10||y>H-10)continue;
      const label=seg.id;ctx.font='bold 8px monospace';const tw=ctx.measureText(label).width;
      ctx.fillStyle=col+'22';ctx.strokeStyle=col;ctx.lineWidth=0.5;ctx.beginPath();ctx.roundRect(x-tw/2-3,y-7,tw+6,12,2);ctx.fill();ctx.stroke();
      ctx.fillStyle=col;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x,y);
    }
  }
}

  const bondColors={CN_BOND:'#dc3545',US_BOND:'#0366d6',JP_BOND:'#28a745',EURO_BOND:'#6f42c1'};
  if(bh.markers&&Array.isArray(bh.markers)){
    const latest={};for(const m of bh.markers){if(!latest[m.bond]||m.ts>latest[m.bond].ts)latest[m.bond]=m;}
    for(const[bondKey,label]of Object.entries(bondNames)){
      const m=latest[bondKey];if(!m)continue;
      const actionCls=m.action==='敞開'?'up':m.action==='對沖'?'down':'neutral';
      const actionTxt=m.action==='敞開'?'📈 敞开':m.action==='對沖'?'📉 对冲':'➡️ 观望';
      h+=`<div style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:${bondColors[bondKey]}"></span><span style="color:#586069;font-size:10px">${label}</span><span class="ap-v ${actionCls}" style="font-size:10px">${actionTxt}</span></div>`;
    }
  }
  h+=`</div>`;
  
  // 图表区域：每个bond一个小图
  h+=`<div style="display:flex;gap:8px;flex-wrap:wrap">`;
  for(const[bondKey,label]of Object.entries(bondNames)){
    const bondData=bh.bonds&&bh.bonds[bondKey];
    if(!bondData||!bondData.divergence_points||!bondData.divergence_points.length)continue;
    h+=`<div style="flex:1;min-width:200px"><div style="font-size:10px;color:#586069;font-weight:600;margin-bottom:2px">${label}</div><div id="bondChart_${bondKey}" style="width:100%;height:150px;position:relative"></div></div>`;
  }
  h+=`</div>`;
  
  h+=`</div>`;
  panel.innerHTML=h+'</div>';
  
  // 渲染每个bond的图表
  setTimeout(()=>{
    for(const[bondKey,label]of Object.entries(bondNames)){
      const chartDiv=document.getElementById('bondChart_'+bondKey);
      if(!chartDiv)continue;
      const bondData=bh.bonds&&bh.bonds[bondKey];
      if(!bondData||!bondData.divergence_points||!bondData.divergence_points.length)continue;
      
      const pts=bondData.divergence_points;
      const bondColor=bondColors[bondKey];
      
      // bond_slope数据
      const slopeData=pts.filter(p=>p.bond_slope!=null).map(p=>({time:Math.floor(p.t),value:p.bond_slope*100}));
      // fx_slope数据
      const fxData=pts.filter(p=>p.fx_slope!=null).map(p=>({time:Math.floor(p.t),value:p.fx_slope*100}));
      
      if(!slopeData.length&&!fxData.length)continue;
      
      // 去重+排序
      const dedup=(arr)=>{const seen=new Set();return arr.filter(d=>{if(seen.has(d.time))return false;seen.add(d.time);return true;}).sort((a,b)=>a.time-b.time);};
      const sd=dedup(slopeData), fd=dedup(fxData);
      
      const ch=LightweightCharts.createChart(chartDiv,{
        width:chartDiv.clientWidth,height:150,
        layout:{background:{type:'solid',color:'#fafbfc'},textColor:'#8b949e',fontSize:9},
        grid:{vertLines:{color:'#f0f0f0'},horzLines:{color:'#f0f0f0'}},
        crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
        timeScale:{visible:false},
        rightPriceScale:{scaleMargins:{top:0.1,bottom:0.1}}
      });
      
      if(sd.length){
        const s1=ch.addLineSeries({color:bondColor,width:1.5,name:'债券斜率'});
        s1.setData(sd);
      }
      if(fd.length){
        const s2=ch.addLineSeries({color:'#007bff',width:1.5,name:'汇率斜率',lineStyle:LightweightCharts.LineStyle.Dashed});
        s2.setData(fd);
      }
      ch.timeScale().fitContent();
      
      // tooltip
      chartDiv.addEventListener('mousemove',(e)=>{
        const popup=document.getElementById('popup');
        const rect=chartDiv.getBoundingClientRect();
        const x=e.clientX-rect.left;
        const time=ch.timeScale().coordinateToTime(x);
        if(!time){popup.style.display='none';return;}
        // 找最近的点
        const allPts=[...sd,...fd];
        const closest=allPts.reduce((best,p)=>Math.abs(p.time-time)<Math.abs(best.time-time)?p:best,allPts[0]);
        if(!closest){popup.style.display='none';return;}
        popup.innerHTML=`<div class="t">${label}</div><div class="r"><span class="l">时间</span><span class="v">${new Date(closest.time*1000).toLocaleString('zh-CN',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',month:'2-digit',day:'2-digit'})}</span></div><div class="r"><span class="l">斜率</span><span class="v">${closest.value.toFixed(4)}%</span></div>`;
        popup.style.display='block';
        popup.style.left=(e.clientX+12)+'px';
        popup.style.top=(e.clientY-10)+'px';
      });
      chartDiv.addEventListener('mouseleave',()=>{document.getElementById('popup').style.display='none';});
      
      bondCharts[bondKey]=ch;
    }
  },200);
}

// ========== Pairwise Divergence Overlay ==========
// 基于RT数据计算市场间背离（在重叠交易时间内检测方向相反）
function drawPairwiseDivergence(ch,seriesMap,allData,uid){
  const container=ch.chartElement();
  const ov=getOrCreateOverlay(container,uid,'pwd');
  const ctx=ov.getContext('2d');const W=container.clientWidth,H=container.clientHeight;ov.width=W;ov.height=H;ctx.clearRect(0,0,W,H);

  const mktKeys=Object.keys(MKT);
  // 收集每个市场的RT百分比数据
  const mktRT={};
  for(const k of mktKeys){
    const rt=allData['rtPct_'+k];
    if(rt&&rt.length)mktRT[k]=rt;
  }

  const pairColors=[
    {fill:'rgba(255,87,34,0.20)',stroke:'rgba(255,87,34,0.6)'},
    {fill:'rgba(156,39,176,0.20)',stroke:'rgba(156,39,176,0.6)'},
    {fill:'rgba(0,150,136,0.20)',stroke:'rgba(0,150,136,0.6)'},
    {fill:'rgba(255,193,7,0.20)',stroke:'rgba(255,193,7,0.6)'},
    {fill:'rgba(33,150,243,0.20)',stroke:'rgba(33,150,243,0.6)'},
    {fill:'rgba(76,175,80,0.20)',stroke:'rgba(76,175,80,0.6)'}
  ];

  let pi=0;
  for(let i=0;i<mktKeys.length;i++){
    for(let j=i+1;j<mktKeys.length;j++){
      const kA=mktKeys[i],kB=mktKeys[j];
      const rtA=mktRT[kA],rtB=mktRT[kB];
      if(!rtA||!rtB)continue;
      const sA=seriesMap[kA],sB=seriesMap[kB];
      if(!sA||!sB)continue;

      const pc=pairColors[pi%pairColors.length];

      // 构建时间→值映射
      const mapA=new Map(rtA.map(b=>[b.time,b.value]));
      const mapB=new Map(rtB.map(b=>[b.time,b.value]));

      // 找两个市场的重叠时间点
      const commonTimes=[];
      for(const[ts]of mapA){if(mapB.has(ts))commonTimes.push(ts);}
      commonTimes.sort((a,b)=>a-b);

      if(commonTimes.length<10){pi++;continue;}

      // 用滑动窗口检测背离（60分钟窗口，每10分钟步进）
      const WINDOW=60;const STEP=10;
      for(let si=0;si<commonTimes.length-WINDOW;si+=STEP){
        const winTimes=commonTimes.slice(si,si+WINDOW);
        const valsA=winTimes.map(t=>mapA.get(t));
        const valsB=winTimes.map(t=>mapB.get(t));

        // 计算窗口内方向
        const dirA=valsA[valsA.length-1]-valsA[0];
        const dirB=valsB[valsB.length-1]-valsB[0];

        // 背离条件: 方向相反 且 变化>0.1%
        if(Math.abs(dirA)<0.1||Math.abs(dirB)<0.1)continue;
        if((dirA>0&&dirB>0)||(dirA<0&&dirB<0))continue;

        // 画阴影
        const tStart=winTimes[0];
        const tEnd=winTimes[winTimes.length-1];
        const x1=ch.timeScale().timeToCoordinate(tStart);
        const x2=ch.timeScale().timeToCoordinate(tEnd);
        if(x1===null||x2===null||x2-x1<2)continue;

        const yA1=sA.priceToCoordinate(valsA[0]);
        const yA2=sA.priceToCoordinate(valsA[valsA.length-1]);
        const yB1=sB.priceToCoordinate(valsB[0]);
        const yB2=sB.priceToCoordinate(valsB[valsB.length-1]);
        if(yA1===null||yB1===null)continue;

        const topY=Math.min(yA1,yA2,yB1,yB2)-3;
        const botY=Math.max(yA1,yA2,yB1,yB2)+3;

        ctx.fillStyle=pc.fill;ctx.strokeStyle=pc.stroke;ctx.lineWidth=0.8;
        ctx.beginPath();ctx.rect(x1,topY,x2-x1,botY-topY);ctx.fill();ctx.stroke();

        // 标注
        const cfgA=MKT[kA],cfgB=MKT[kB];
        const label=`⚠️ ${cfgA.n}↔${cfgB.n}`;
        const labelY=topY-5;
        if(labelY>10&&labelY<H-10){
          ctx.font='bold 9px monospace';const tw=ctx.measureText(label).width;
          ctx.fillStyle='rgba(255,87,34,0.25)';ctx.strokeStyle='rgba(255,87,34,0.7)';
          ctx.lineWidth=0.8;ctx.beginPath();ctx.roundRect((x1+x2)/2-tw/2-4,labelY-12,tw+8,14,3);ctx.fill();ctx.stroke();
          ctx.fillStyle='#e65100';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText(label,(x1+x2)/2,labelY-5);
        }
      }
      pi++;
    }
  }
}

function showPopup(param,card,rtData){
  const popup=document.getElementById('popup');
  if(!param.event){popup.style.display='none';return;}

  // 找到当前crosshair时间对应的数据
  let val='';
  const rt=rtData||(card&&card.rt)||[];
  if(rt.length){
    // 找最近的数据点 — param.time是HKT时间，需要转回原始时间匹配
    const t=param.time-HKT_OFFSET; // 转回原始时间戳
    for(const bar of rt){
      if(bar.time===t||Math.abs(bar.time-t)<60){val=bar.close;break;}
    }
  }

  // 找对应的段信息
  let segInfo='';
  if(card){
    const segKey=card.key;
    const segData=allD[segKey];
    if(segData&&segData.segments){
      for(const seg of segData.segments){
        const st=toHKT(seg.startTime||seg.start_time);
        const et=toHKT(seg.endTime||seg.end_time);
        if(st<=param.time&&et>=param.time){
          const pct=seg.pctChange||seg.pct||0;
          segInfo=`<div class="r"><span class="l">段</span><span class="v">${seg.id||''}</span></div>
            <div class="r"><span class="l">涨跌</span><span class="v ${pct>0?'up':pct<0?'down':'rg'}">${pct>0?'+':''}${pct.toFixed(2)}%</span></div>`;
          break;
        }
      }
    }
  }

  const timeStr=new Date(param.time*1000).toLocaleString('zh-CN',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit'});
  popup.innerHTML=`<div class="t">${card?.n||''}</div>
    <div class="r"><span class="l">时间</span><span class="v">HKT ${timeStr}</span></div>
    ${val?'<div class="r"><span class="l">价格</span><span class="v">'+val.toFixed(2)+'</span></div>':''}
    ${segInfo}`;
  let left=param.event.clientX+15;let top=param.event.clientY-10;
  if(left+320>window.innerWidth)left=param.event.clientX-330;
  if(top+180>window.innerHeight)top=param.event.clientY-180;
  if(top<5)top=5;
  popup.style.left=left+'px';popup.style.top=top+'px';popup.style.display='block';
}

  const el=document.getElementById('legend');let h=`<div class="legend-item"><span class="dot" style="background:#959da5;border:1px dashed #959da5"></span><span class="lbl">SOXL/3 24h</span></div>`;
  let totalDiv=0;
  for(const[k,data]of Object.entries(allD)){
    if(!k.startsWith('segments_')||!data.segments)continue;const cfg=MKT[k]||{c:'#666',n:k};const segs=data.segments;const divs=segs.filter(s=>s.divergence).length;totalDiv+=divs;
    const ids=segs.map(s=>s.id);const idRange=ids.length?`${ids[0]}~${ids[ids.length-1]}`:'';

    h+=`<div class="legend-item"><span class="dot" style="background:${cfg.c}"></span><span class="lbl">${cfg.n}</span><span class="st">${segs.length}段 ${idRange} ⚠️${divs} ${rtInfo}</span></div>`;
  }
  el.innerHTML=h;document.getElementById('tab1Badge').textContent=totalDiv;
}

// ========== Tab Switch ==========
// ========== 相关性背离 ==========
const CORR_PAIRS=[
  {id:'dxy_oil',a:{key:'f_USDX_FX',n:'DXY',c:'#007bff'},b:{key:'f_CL',n:'原油',c:'#28a745'},type:'pos',label:'正相关',desc:'DXY↑则原油↑（美元走强→商品涨价）'},
  {id:'dxy_gold',a:{key:'f_USDX_FX',n:'DXY',c:'#007bff'},b:{key:'f_CFDGOLD',n:'黄金',c:'#FFD700'},type:'neg',label:'负相关',desc:'DXY↑则黄金↓（美元走强→金价承压）'},
  {id:'dxy_btc',a:{key:'f_USDX_FX',n:'DXY',c:'#007bff'},b:{key:'f_BTC_SPOT',n:'BTC',c:'#F7931A'},type:'neg',label:'负相关',desc:'DXY↑则BTC↓（美元走强→风险资产承压）'}
];

function buildCorrelationPanel(){
  const container=document.getElementById('corrContainer');
  container.innerHTML='';container.style.display='block';
  let badge=0;
  for(const pair of CORR_PAIRS){
    const dA=allD[pair.a.key],dB=allD[pair.b.key];
    if(!dA||!dB)continue;
    // 转换为HKT百分比（各市场独立归一化）
    const toPct=(d)=>{
      if(Array.isArray(d)){
        if(!d.length)return[];
        const ref=d[0].close;
        return d.map(p=>({time:toHKT(p.time),value:((p.close-ref)/ref)*100}));
      }
      if(d.t&&d.c){
        if(!d.t.length)return[];
        const ref=d.c[0];
        return d.t.map((t,i)=>({time:toHKT(t),value:((d.c[i]-ref)/ref)*100}));
      }
      return[];
    };
    const pctA=toPct(dA),pctB=toPct(dB);
    if(!pctA.length||!pctB.length)continue;

    // 检测背离: 滑动窗口60根
    const mapA=new Map(pctA.map(p=>[p.time,p.value]));
    const mapB=new Map(pctB.map(p=>[p.time,p.value]));
    const common=[];for(const[ts]of mapA){if(mapB.has(ts))common.push(ts);}common.sort((a,b)=>a-b);

    let divWindows=[];
    const W=60,STEP=10;
    for(let i=0;i<common.length-W;i+=STEP){
      const w=common.slice(i,i+W);
      const vA=w.map(t=>mapA.get(t)),vB=w.map(t=>mapB.get(t));
      const dA=vA[vA.length-1]-vA[0],dB_=vB[vB.length-1]-vB[0];
      if(Math.abs(dA)<0.05||Math.abs(dB_)<0.05)continue;
      let isDiv=false;
      if(pair.type==='pos'){isDiv=(dA>0&&dB_<0)||(dA<0&&dB_>0);}
      else{isDiv=(dA>0&&dB_>0)||(dA<0&&dB_<0);}
      if(isDiv)divWindows.push({start:w[0],end:w[w.length-1],dA,dB:dB_});
    }

    const isCurrentlyDiv=divWindows.length>0;
    if(isCurrentlyDiv)badge++;

    const section=document.createElement('div');section.className='corr-section';
    section.innerHTML=`
      <div class="corr-header${isCurrentlyDiv?' open':''}" onclick="toggleCorrSection(this)">
        <div style="display:flex;align-items:center">
          <span class="corr-title">${pair.a.n} ↔ ${pair.b.n}</span>
          <span class="corr-type ${pair.type}">${pair.label}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="corr-status ${isCurrentlyDiv?'div':'ok'}">${isCurrentlyDiv?'⚠️ 背离中':'✅ 正常'}</span>
          <span class="arrow">▶</span>
        </div>
      </div>
      <div class="corr-body${isCurrentlyDiv?' open':''}">
        <div class="corr-chart" id="corrChart_${pair.id}"></div>
        <div class="corr-info">
          <div class="ci-r"><span class="ci-l">相关性规则</span><span class="ci-v">${pair.desc}</span></div>
          <div class="ci-r"><span class="ci-l">背离窗口</span><span class="ci-v">${divWindows.length}个 (60min窗口)</span></div>
          <div class="ci-r"><span class="ci-l">数据点</span><span class="ci-v">A:${pctA.length} B:${pctB.length} 重叠:${common.length}</span></div>
        </div>
      </div>`;
    container.appendChild(section);

    // 创建mini chart
    setTimeout(()=>{
      const chartDiv=document.getElementById('corrChart_'+pair.id);
      if(!chartDiv)return;
      const ch=LightweightCharts.createChart(chartDiv,{
        width:chartDiv.clientWidth,height:200,
        layout:{background:{type:'solid',color:'#fff'},textColor:'#586069',fontSize:10},
        grid:{vertLines:{color:'#f0f0f0'},horzLines:{color:'#f0f0f0'}},
        crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
        timeScale:{timeVisible:true,secondsVisible:false}
      });
      const sA=ch.addLineSeries({color:pair.a.c,width:2,name:pair.a.n});
      const sB=ch.addLineSeries({color:pair.b.c,width:2,name:pair.b.n});
      sA.setData(pctA);sB.setData(pctB);

      // 画背离阴影
      const drawDiv=()=>{
        const ovId='corr_ov_'+pair.id;
        let ov=chartDiv.querySelector('#'+ovId);
        if(!ov){ov=document.createElement('canvas');ov.id=ovId;ov.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5';chartDiv.style.position='relative';chartDiv.appendChild(ov);}
        const ctx=ov.getContext('2d');ov.width=chartDiv.clientWidth;ov.height=200;ctx.clearRect(0,0,ov.width,ov.height);
        for(const dw of divWindows){
          const x1=ch.timeScale().timeToCoordinate(dw.start);
          const x2=ch.timeScale().timeToCoordinate(dw.end);
          if(x1===null||x2===null||x2-x1<2)continue;
          ctx.fillStyle='rgba(220,53,69,0.12)';ctx.strokeStyle='rgba(220,53,69,0.4)';ctx.lineWidth=0.8;
          ctx.beginPath();ctx.rect(x1,0,x2-x1,200);ctx.fill();ctx.stroke();
        }
      };
      ch.timeScale().subscribeVisibleLogicalRangeChange(()=>setTimeout(drawDiv,50));
      setTimeout(()=>{ch.timeScale().fitContent();setTimeout(drawDiv,200);},300);
      corrCharts[pair.id]=ch;
    },100);
  }
  document.getElementById('tab4Badge').textContent=badge||'0';
}
function toggleCorrSection(header){
  header.classList.toggle('open');
  const body=header.nextElementSibling;
  body.classList.toggle('open');
  // Resize chart
  const chartDiv=body.querySelector('.corr-chart');
  if(chartDiv){
    const pairId=chartDiv.id.replace('corrChart_','');
    const ch=corrCharts[pairId];
    if(ch){ch.applyOptions({width:chartDiv.clientWidth,height:200});}
  }
}

function switchTab(idx){
  currentTab=idx;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  document.querySelectorAll('.panel').forEach((p,i)=>p.classList.toggle('active',i===idx));
  // Right dock: show on tab 0 (盘内) or tab 1 (盘外)
  const showDock=idx===0||idx===1;
  document.getElementById('rightDock').classList.toggle('open',showDock);
  document.getElementById('intradayPanel').style.display=idx===0?'block':'none';
  document.getElementById('offhoursPanel').style.display=idx===1?'block':'none';
  document.getElementById('bondPanel').style.display=idx===1?'block':'none';
  // tab4: 隐藏主布局，避免空白占位
  document.querySelector('.main-layout').style.display=idx===3?'none':'flex';
  document.getElementById('corrContainer').style.display=idx===3?'block':'none';
  document.getElementById('legend').style.display=idx===3?'none':'flex';
  document.getElementById('marketBar').style.display=idx===3?'none':'flex';
  if(idx===0){updateLegendUI1();renderIntradayPanel();}
  else if(idx===1){updateLegendUI2();renderOffhoursPanel();renderBondPanel();}
  else if(idx===3){buildCorrelationPanel();}
  else{updateLegendUI3();}
  if(idx!==3){
    const ch=idx===0?null:idx===1?charts.ui2:charts.ui3;
    if(ch){const c=ch.chartElement().parentElement;ch.applyOptions({width:c.clientWidth,height:c.clientHeight});}
    if(idx===0){/* UI1 uses individual mktCards, no resize needed */}
  }
}

function populateDates(){
  const sel=document.getElementById('dateFilter');const dates=new Set();
  for(const[k,data]of Object.entries(allD)){
    if(!k.startsWith('segments_')||!data.segments)continue;
    for(const seg of data.segments){const st=seg.startTime||seg.start_time;const d=new Date(st*1000);dates.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);}
  }
  sel.innerHTML='<option value="all">全部日期</option>';[...dates].sort().forEach(d=>{sel.innerHTML+=`<option value="${d}">${d}</option>`;});
}

async function init(){
  await loadAll();
  buildUI1();buildUI2();buildUI3();
  populateDates();switchTab(0);updateMarketBar();
  setInterval(updateMarketBar,10000);
  setInterval(async()=>{allD={};await loadAll();buildUI1();buildUI2();buildUI3();populateDates();switchTab(currentTab);},REFRESH_INTERVAL);
}
async function refreshAll(){allD={};await init();}
function fitFullRange(){
  const ch=currentTab===0?charts.ui1:currentTab===1?charts.ui2:charts.ui3;
  if(!ch)return;ch.timeScale().fitContent();
  setTimeout(()=>{if(currentTab===0&&series.ui1.soxl){drawDivergenceOverlay(ch,series.ui1,allD);drawSegmentLabels(ch,series.ui1,allD);}if(currentTab===2)drawSegmentLabels(ch,series.ui3,allD);},200);
}

window.addEventListener('load',init);
</script>
